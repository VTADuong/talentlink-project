<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Lỗi hệ thống — TalentLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">TalentLink</a>
    </div>
</nav>
<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm text-center p-4 p-md-5">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle"
                          style="width: 72px; height: 72px;">
                        <i class="bi bi-exclamation-octagon-fill fs-1"></i>
                    </span>
                </div>
                <span class="badge bg-danger-subtle text-danger align-self-center mb-2 px-3 py-1">Mã lỗi 500</span>
                <h2 class="fw-bold text-dark mb-2"
                    th:text="${errorTitle != null ? errorTitle : 'Hệ thống đang gặp sự cố tạm thời'}">
                    Hệ thống đang gặp sự cố tạm thời
                </h2>
                <p class="text-secondary mb-4"
                   th:text="${userFriendlyMessage != null ? userFriendlyMessage : 'Đã xảy ra lỗi ngoài ý muốn trong quá trình xử lý yêu cầu. Đội ngũ kỹ thuật đã ghi nhận sự cố, vui lòng thử lại sau ít phút.'}">
                    Đã xảy ra lỗi ngoài ý muốn trong quá trình xử lý yêu cầu. Vui lòng thử lại sau.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i>Về trang chủ
                    </a>
                    <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-clockwise me-1"></i>Thử lại
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    &copy; 2026 TalentLink
</footer>
</body>
</html>
