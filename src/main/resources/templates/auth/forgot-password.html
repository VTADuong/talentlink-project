<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — TalentLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-briefcase-fill text-primary me-2"></i>TalentLink
        </a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
    </div>
</nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4">
                <div class="text-center mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle mb-2"
                          style="width: 54px; height: 54px;">
                        <i class="bi bi-key-fill fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark mb-1">Quên mật khẩu</h3>
                    <p class="text-muted small mb-0">
                        Nhập email tài khoản của bạn để hệ thống sinh <strong>mã OTP 6 số</strong>
                        (hiệu lực 10 phút, ghi ra Console Log)
                    </p>
                </div>

                <form th:action="@{/forgot-password}" th:object="${forgotPasswordDto}" method="post" novalidate>
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">
                            Email đã đăng ký <span class="text-danger">*</span>
                        </label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="student01@talentlink.demo"
                               autofocus>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                            Email không tồn tại
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-send-fill me-1"></i>Nhận mã OTP 6 số
                    </button>
                </form>

                <hr class="my-4">
                <div class="d-flex justify-content-between small">
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại Đăng nhập
                    </a>
                    <a th:href="@{/reset-password}" class="text-decoration-none fw-semibold">
                        Đã có mã OTP? Đặt lại mật khẩu
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    &copy; 2026 TalentLink • Khôi phục mật khẩu bằng OTP 6 số
</footer>
</body>
</html>
