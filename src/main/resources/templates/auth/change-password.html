<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu — TalentLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-briefcase-fill text-primary me-2"></i>TalentLink
        </a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/}">Trang chủ</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4">
                <div class="text-center mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-2"
                          style="width: 54px; height: 54px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark mb-1">Đổi mật khẩu</h3>
                    <p class="text-muted small mb-0">Nhập đúng mật khẩu hiện tại để thiết lập mật khẩu mới</p>
                </div>

                <!-- Thông báo khi đổi mật khẩu thành công -->
                <div th:if="${successMessage != null}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}">Đổi mật khẩu thành công!</span>
                </div>

                <form th:action="@{/change-password}" th:object="${changePasswordDto}" method="post" novalidate>
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <!-- 1. Mật khẩu cũ -->
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold">
                            Mật khẩu hiện tại (mật khẩu cũ) <span class="text-danger">*</span>
                        </label>
                        <input type="password"
                               id="currentPassword"
                               th:field="*{currentPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập mật khẩu đang sử dụng">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('currentPassword')}"
                             th:errors="*{currentPassword}">
                            Mật khẩu cũ không chính xác
                        </div>
                    </div>

                    <!-- 2. Mật khẩu mới -->
                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold">
                            Mật khẩu mới <span class="text-danger">*</span>
                        </label>
                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                               placeholder="Tối thiểu 8 ký tự">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('newPassword')}"
                             th:errors="*{newPassword}">
                            Lỗi mật khẩu mới
                        </div>
                    </div>

                    <!-- 3. Nhập lại mật khẩu mới -->
                    <div class="mb-4">
                        <label for="confirmNewPassword" class="form-label fw-semibold">
                            Nhập lại mật khẩu mới <span class="text-danger">*</span>
                        </label>
                        <input type="password"
                               id="confirmNewPassword"
                               th:field="*{confirmNewPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập lại đúng mật khẩu mới">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('confirmNewPassword')}"
                             th:errors="*{confirmNewPassword}">
                            Mật khẩu nhập lại không khớp
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i>Cập nhật mật khẩu
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    &copy; 2026 TalentLink • Bảo mật tài khoản
</footer>
</body>
</html>
