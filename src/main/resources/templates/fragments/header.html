<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <!-- Logo & Brand -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span class="badge bg-primary rounded-2 p-2">
                    <i class="bi bi-briefcase-fill"></i>
                </span>
                <span>TalentLink</span>
            </a>

            <!-- Mobile Hamburger Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#talentlinkNavbar" aria-controls="talentlinkNavbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links by Role -->
            <div class="collapse navbar-collapse" id="talentlinkNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Menu chung cho tất cả người dùng -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>Trang chủ
                        </a>
                    </li>

                    <!-- Menu dành cho ỨNG VIÊN / SINH VIÊN (ROLE_CANDIDATE) -->
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')">
                        <a class="nav-link" th:href="@{/candidate/profile}">
                            <i class="bi bi-person-badge me-1"></i>Hồ sơ của tôi
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CANDIDATE')">
                        <a class="nav-link" th:href="@{/interviews}">
                            <i class="bi bi-calendar2-check me-1"></i>Yêu cầu phỏng vấn
                        </a>
                    </li>

                    <!-- Menu dành cho ĐỐI TÁC / NHÀ TUYỂN DỤNG (ROLE_RECRUITER) -->
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                        <a class="nav-link" th:href="@{/candidates}">
                            <i class="bi bi-search me-1"></i>Tìm ứng viên
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                        <a class="nav-link" th:href="@{/shortlists}">
                            <i class="bi bi-bookmark-star me-1"></i>Ứng viên đã lưu
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                        <a class="nav-link" th:href="@{/interviews}">
                            <i class="bi bi-calendar-event me-1"></i>Yêu cầu phỏng vấn
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('RECRUITER')">
                        <a class="nav-link" th:href="@{/recruiter/company}">
                            <i class="bi bi-building me-1"></i>Hồ sơ công ty
                        </a>
                    </li>

                    <!-- Menu dành cho QUẢN TRỊ VIÊN (ROLE_ADMIN) -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/accounts}">
                            <i class="bi bi-people-fill me-1"></i>Quản trị tài khoản
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/approvals}">
                            <i class="bi bi-clipboard2-check-fill me-1"></i>Hàng chờ duyệt
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/candidates}">
                            <i class="bi bi-search me-1"></i>Danh sách ứng viên
                        </a>
                    </li>
                </ul>

                <!-- Khu vực bên phải: Tên người dùng / Thông báo / Đăng nhập / Đăng xuất -->
                <div class="d-flex align-items-center gap-2">
                    <!-- Khi CHƯA đăng nhập -->
                    <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                        <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                        </a>
                        <a class="btn btn-primary btn-sm px-3" th:href="@{/register}">
                            <i class="bi bi-person-plus me-1"></i>Đăng ký
                        </a>
                    </div>

                    <!-- Khi ĐÃ đăng nhập -->
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                        <!-- Icon thông báo -->
                        <a class="btn btn-dark btn-sm position-relative text-light"
                           th:href="@{/notifications}" title="Thông báo">
                            <i class="bi bi-bell"></i>
                            <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                                  th:text="${unreadNotificationCount}"
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                            </span>
                        </a>

                        <!-- Nhãn vai trò & Tên người dùng -->
                        <div class="text-light small d-flex align-items-center gap-2">
                            <span class="badge bg-info text-dark" sec:authorize="hasRole('CANDIDATE')">Ứng viên</span>
                            <span class="badge bg-warning text-dark" sec:authorize="hasRole('RECRUITER')">Đối tác</span>
                            <span class="badge bg-danger" sec:authorize="hasRole('ADMIN')">Admin</span>
                            <span class="fw-semibold">
                                <i class="bi bi-person-circle me-1"></i>
                                <span sec:authentication="name">user@talentlink.demo</span>
                            </span>
                        </div>

                        <!-- Form Đăng xuất (POST kèm CSRF token của Spring Security) -->
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
