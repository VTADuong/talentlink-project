spring.application.name=talentlink
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Khong bao gio lo stack trace hoac chi tiet exception noi bo ra giao dien
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Cau hinh upload file minh chung chung chi (toi da 5MB) va anh dai dien (toi da 2MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.certificate-dir=${CERTIFICATE_UPLOAD_DIR:uploads/certificates}
app.upload.avatar-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
