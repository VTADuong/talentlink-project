<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%" font-family="Arial, sans-serif">
  <rect width="800" height="560" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Top Navbar -->
  <rect width="800" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1e293b">[Logo] TalentLink</text>
  <rect x="700" y="14" width="80" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="712" y="32" font-size="12" fill="#334155">Đăng nhập</text>

  <!-- Register Card -->
  <rect x="200" y="76" width="400" height="456" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="110" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">ĐĂNG KÝ TÀI KHOẢN</text>

  <!-- Role Selector -->
  <text x="230" y="138" font-size="12" font-weight="bold" fill="#334155">Bạn là: *</text>
  <rect x="230" y="146" width="165" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="312" y="168" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">(•) Ứng viên</text>
  <rect x="405" y="146" width="165" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="487" y="168" font-size="12" fill="#475569" text-anchor="middle">( ) Nhà tuyển dụng</text>

  <!-- Full Name -->
  <text x="230" y="202" font-size="12" font-weight="bold" fill="#334155">Họ và tên *</text>
  <rect x="230" y="210" width="340" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="242" y="232" font-size="12" fill="#94a3b8">Nguyễn Văn A</text>

  <!-- Email -->
  <text x="230" y="264" font-size="12" font-weight="bold" fill="#334155">Email *</text>
  <rect x="230" y="272" width="340" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="242" y="294" font-size="12" fill="#94a3b8">nguyenvana@email.com</text>

  <!-- Password & Confirm Password -->
  <text x="230" y="326" font-size="12" font-weight="bold" fill="#334155">Mật khẩu *</text>
  <rect x="230" y="334" width="165" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="242" y="356" font-size="12" fill="#94a3b8">••••••••</text>

  <text x="405" y="326" font-size="12" font-weight="bold" fill="#334155">Nhập lại mật khẩu *</text>
  <rect x="405" y="334" width="165" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="417" y="356" font-size="12" fill="#94a3b8">••••••••</text>

  <!-- Phone / Company -->
  <text x="230" y="388" font-size="12" font-weight="bold" fill="#334155">Số điện thoại / Tên công ty (nếu là NTD)</text>
  <rect x="230" y="396" width="340" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="242" y="418" font-size="12" fill="#94a3b8">0901234567</text>

  <!-- Submit -->
  <rect x="230" y="446" width="340" height="40" rx="6" fill="#2563eb"/>
  <text x="400" y="471" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Tạo tài khoản</text>

  <text x="400" y="512" font-size="12" fill="#475569" text-anchor="middle">Đã có tài khoản? <tspan fill="#2563eb" font-weight="bold">Đăng nhập</tspan></text>
</svg>
