<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Top Navbar -->
  <rect width="800" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1e293b">[Logo] TalentLink</text>
  <text x="640" y="34" font-size="13" fill="#475569">Trang chủ</text>
  <rect x="710" y="14" width="70" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="722" y="32" font-size="12" fill="#334155">Đăng ký</text>

  <!-- Login Card -->
  <rect x="230" y="90" width="340" height="360" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="130" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">ĐĂNG NHẬP</text>
  <text x="400" y="152" font-size="12" fill="#64748b" text-anchor="middle">Chào mừng bạn quay trở lại TalentLink</text>

  <!-- Email Input -->
  <text x="260" y="185" font-size="12" font-weight="bold" fill="#334155">Email *</text>
  <rect x="260" y="193" width="280" height="36" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="272" y="216" font-size="12" fill="#94a3b8">nhap-email@example.com</text>

  <!-- Password Input -->
  <text x="260" y="250" font-size="12" font-weight="bold" fill="#334155">Mật khẩu *</text>
  <rect x="260" y="258" width="280" height="36" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="272" y="281" font-size="12" fill="#94a3b8">••••••••••••</text>

  <!-- Remember me & Forgot password -->
  <rect x="260" y="308" width="14" height="14" rx="2" fill="#ffffff" stroke="#64748b"/>
  <text x="280" y="320" font-size="12" fill="#475569">Ghi nhớ đăng nhập</text>
  <text x="460" y="320" font-size="12" fill="#2563eb">Quên mật khẩu?</text>

  <!-- Submit Button -->
  <rect x="260" y="345" width="280" height="40" rx="6" fill="#2563eb"/>
  <text x="400" y="370" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Đăng nhập</text>

  <!-- Footer link -->
  <text x="400" y="420" font-size="12" fill="#475569" text-anchor="middle">Chưa có tài khoản? <tspan fill="#2563eb" font-weight="bold">Đăng ký ngay</tspan></text>
</svg>
