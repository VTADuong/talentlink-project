  <!-- Relation Labels -->
  <text x="410" y="202" font-size="11" font-weight="bold" fill="#2563eb">1 : 1</text>
  <text x="182" y="370" font-size="11" font-weight="bold" fill="#2563eb">1 : 1</text>
  <text x="112" y="595" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="900" y="142" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="935" y="322" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="935" y="507" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="935" y="687" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="682" y="392" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="602" y="598" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="567" y="790" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="895" y="847" font-size="11" font-weight="bold" fill="#2563eb">1 : N</text>

  <!-- ==================== 1. USERS ==================== -->
  <g transform="translate(40, 90)">
    <rect width="260" height="240" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <rect width="260" height="32" rx="6" fill="#1e40af"/>
    <text x="130" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. users</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#0369a1">UK</tspan> email : VARCHAR(150)</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">password_hash : VARCHAR(255)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">full_name : VARCHAR(100)</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">phone : VARCHAR(20)</text>
    <text x="12" y="152" font-size="11" fill="#0f172a">role : ENUM(CANDIDATE, RECRUITER, ADMIN)</text>
    <text x="12" y="172" font-size="11" fill="#0f172a">is_locked : BOOLEAN (default false)</text>
    <text x="12" y="192" font-size="11" fill="#0f172a">locked_reason : VARCHAR(255)</text>
    <text x="12" y="212" font-size="11" fill="#64748b">created_at, updated_at : DATETIME</text>
  </g>

  <!-- ==================== 8. COMPANIES ==================== -->
  <g transform="translate(40, 400)">
    <rect width="260" height="190" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="260" height="32" rx="6" fill="#7c3aed"/>
    <text x="130" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8. companies</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK,UK</tspan> user_id : BIGINT → users.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">company_name : VARCHAR(150)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">tax_code : VARCHAR(50)</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">website, logo_url : VARCHAR(255)</text>
    <text x="12" y="152" font-size="11" fill="#0f172a">company_size, address : VARCHAR</text>
    <text x="12" y="172" font-size="11" fill="#64748b">description : TEXT | created_at</text>
  </g>

  <!-- ==================== 12. NOTIFICATIONS ==================== -->
  <g transform="translate(40, 630)">
    <rect width="260" height="190" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect width="260" height="32" rx="6" fill="#475569"/>
    <text x="130" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">12. notifications</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> recipient_id : BIGINT → users.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">type : ENUM(PROFILE_REVIEW,...)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">title : VARCHAR(200)</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">content : TEXT</text>
    <text x="12" y="152" font-size="11" fill="#0f172a">reference_url : VARCHAR(255)</text>
    <text x="12" y="172" font-size="11" fill="#0f172a">is_read : BOOLEAN | created_at</text>
  </g>

  <!-- ==================== 2. PROFILES ==================== -->
  <g transform="translate(520, 90)">
    <rect width="300" height="275" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="300" height="32" rx="6" fill="#0284c7"/>
    <text x="150" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. profiles</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK,UK</tspan> user_id : BIGINT → users.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">headline : VARCHAR(150)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">bio : TEXT</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">years_of_experience : INT</text>
    <text x="12" y="152" font-size="11" fill="#0f172a">location : VARCHAR(100)</text>
    <text x="12" y="172" font-size="11" fill="#0f172a">expected_salary : DECIMAL(12,2)</text>
    <text x="12" y="192" font-size="11" fill="#0f172a">cv_url, avatar_url : VARCHAR(255)</text>
    <text x="12" y="212" font-size="11" fill="#0f172a">is_open_to_work : BOOLEAN</text>
    <text x="12" y="232" font-size="11" fill="#0f172a">approval_status : ENUM(DRAFT, PENDING,</text>
    <text x="24" y="248" font-size="11" fill="#0f172a">APPROVED, REJECTED)</text>
    <text x="12" y="264" font-size="11" fill="#64748b">submitted_at, approved_at, updated_at</text>
  </g>

  <!-- ==================== 11. PROFILE_REVIEWS ==================== -->
  <g transform="translate(520, 410)">
    <rect width="300" height="165" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
