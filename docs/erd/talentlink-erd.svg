    <text x="12" y="92" font-size="11" fill="#0f172a">school_name : VARCHAR(150) | degree : VARCHAR(100)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">major : VARCHAR(150) | gpa : DECIMAL(3,2)</text>
    <text x="12" y="132" font-size="11" fill="#64748b">start_date, end_date : DATE | description : TEXT</text>
  </g>

  <!-- ==================== 6. PROJECTS ==================== -->
  <g transform="translate(980, 265)">
    <rect width="380" height="150" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect width="380" height="32" rx="6" fill="#0d9488"/>
    <text x="190" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6. projects</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">project_name : VARCHAR(150) | role_in_project : VARCHAR(100)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">tech_stack : VARCHAR(255) | project_url : VARCHAR(255)</text>
    <text x="12" y="132" font-size="11" fill="#64748b">start_date, end_date : DATE | description : TEXT</text>
  </g>

  <!-- ==================== 7. CERTIFICATES ==================== -->
  <g transform="translate(980, 440)">
    <rect width="380" height="150" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect width="380" height="32" rx="6" fill="#0d9488"/>
    <text x="190" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7. certificates</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a">certificate_name : VARCHAR(150)</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">issuing_organization : VARCHAR(150)</text>
    <text x="12" y="132" font-size="11" fill="#64748b">issue_date, expiry_date : DATE | credential_url</text>
  </g>

  <!-- ==================== 5. PROFILE_SKILLS (MỨC 1-5) ==================== -->
  <g transform="translate(980, 620)">
    <rect width="240" height="165" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="240" height="32" rx="6" fill="#16a34a"/>
    <text x="120" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. profile_skills</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> skill_id : BIGINT → skills.id</text>
    <text x="12" y="112" font-size="11" font-weight="bold" fill="#15803d">proficiency_level : TINYINT (1..5)</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">years_used : DECIMAL(3,1)</text>
    <text x="12" y="152" font-size="11" fill="#64748b"><tspan font-weight="bold" fill="#0369a1">UK</tspan>(profile_id, skill_id)</text>
  </g>

  <!-- ==================== 4. SKILLS ==================== -->
  <g transform="translate(1240, 620)">
    <rect width="140" height="165" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <rect width="140" height="32" rx="6" fill="#15803d"/>
    <text x="70" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. skills</text>
    <text x="10" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="10" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#0369a1">UK</tspan> name : VARCHAR</text>
    <text x="10" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#0369a1">UK</tspan> slug : VARCHAR</text>
    <text x="10" y="112" font-size="11" fill="#0f172a">category : VARCHAR</text>
    <text x="10" y="132" font-size="11" fill="#64748b">created_at</text>
  </g>

  <!-- ==================== 13. PROFILE_VIEWS ==================== -->
  <g transform="translate(980, 815)">
    <rect width="380" height="150" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect width="380" height="32" rx="6" fill="#475569"/>
    <text x="190" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">13. profile_views</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> viewer_id : BIGINT (NULLABLE) → users.id</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">ip_address : VARCHAR(45) | user_agent : VARCHAR(255)</text>
    <text x="12" y="132" font-size="11" fill="#64748b">viewed_at : DATETIME</text>
  </g>
</svg>
