    <text x="150" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">11. profile_reviews (Lịch sử duyệt)</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> reviewer_id : BIGINT → users.id</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">decision : ENUM(APPROVED, REJECTED)</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">rejection_reason : TEXT</text>
    <text x="12" y="152" font-size="11" fill="#64748b">reviewed_at : DATETIME</text>
  </g>

  <!-- ==================== 9. SHORTLISTS ==================== -->
  <g transform="translate(520, 610)">
    <rect width="300" height="150" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="300" height="32" rx="6" fill="#7c3aed"/>
    <text x="150" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">9. shortlists</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> recruiter_id : BIGINT → users.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="112" font-size="11" fill="#0f172a">note : VARCHAR(255)</text>
    <text x="12" y="132" font-size="11" fill="#64748b"><tspan font-weight="bold" fill="#0369a1">UK</tspan>(recruiter_id, profile_id) | created_at</text>
  </g>

  <!-- ==================== 10. INTERVIEW_REQUESTS ==================== -->
  <g transform="translate(520, 800)">
    <rect width="300" height="190" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
