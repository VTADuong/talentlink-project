    <text x="150" y="21" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">10. interview_requests</text>
    <text x="12" y="52" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#b45309">PK</tspan> id : BIGINT</text>
    <text x="12" y="72" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> recruiter_id : BIGINT → users.id</text>
    <text x="12" y="92" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> company_id : BIGINT → companies.id</text>
    <text x="12" y="112" font-size="11" fill="#0f172a"><tspan font-weight="bold" fill="#15803d">FK</tspan> profile_id : BIGINT → profiles.id</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">job_title : VARCHAR(150) | scheduled_at</text>
    <text x="12" y="152" font-size="11" fill="#0f172a">mode : ENUM(ONLINE, OFFLINE) | meeting_link</text>
    <text x="12" y="172" font-size="11" fill="#0f172a">status : ENUM(PENDING, ACCEPTED, DECLINED, CANCELLED)</text>
  </g>

  <!-- ==================== 3. EDUCATIONS ==================== -->
  <g transform="translate(980, 90)">
    <rect width="380" height="150" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect width="380" height="32" rx="6" fill="#0d9488"/>
