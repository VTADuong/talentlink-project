<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="100%" height="100%" font-family="Arial, sans-serif">
  <rect width="1400" height="1020" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="36" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">SƠ ĐỒ ERD HỆ THỐNG TALENTLINK (13 BẢNG — TASK T4E7A9B)</text>
  <text x="700" y="56" font-size="12" fill="#475569" text-anchor="middle">MySQL 8.0 (InnoDB, utf8mb4) • PK: Khóa chính | FK: Khóa ngoại | UK: Khóa duy nhất</text>

  <!-- RELATIONSHIP LINES -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
